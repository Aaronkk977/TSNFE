# ============================================================================
# Taiwan Analyst Signal Pipeline - Main Configuration File
# ============================================================================
# This file defines the core pipeline parameters
# Environment variables in .env override these values
# ============================================================================

pipeline:
  name: "tw-analyst-signal-pipeline"
  version: "0.1.0"
  description: "Taiwan Stock Analyst Video Signal Extraction"
  
  # Retry configuration
  max_retries: 3
  retry_base_wait_seconds: 1
  retry_max_wait_seconds: 60
  
  # Processing timeout (seconds)
  timeout: 300
  
  # Concurrent processing limits
  max_concurrent_downloads: 3
  max_concurrent_transcriptions: 1  # Limited by GPU memory
  
  # Enable/disable intermediate caching
  enable_caching: true
  cleanup_temp_files: true

# ============================================================================
# Execution Interface (single control plane for runtime behavior)
# ============================================================================
execution:
  # audio: 下載音檔後多模態萃取（預設、最穩）
  # url: 直接讀 YouTube 連結（較不穩）
  # text: 先產出逐字稿，再用 LLM 讀文字
  mode: "text"

  # 僅 mode=text 使用
  # auto: 先快取/CC，失敗再用轉錄
  # cc: 只用快取/YouTube CC
  # gemini: 直接用轉錄產文字
  text_transcript_source: "auto"

# ============================================================================
# YouTube Configuration
# ============================================================================
youtube:
  # List of target analyst channel IDs (empty = use parameter)
  channels: []
  
  # How many days back to search for videos
  video_age_days: 7
  
  # Video filters
  min_video_length_seconds: 300      # Skip videos < 5 minutes
  max_video_length_seconds: 5400     # Skip videos > 2 hours
  
  # Download format
  download_format: "wav"             # wav (best for Whisper), mp3, m4a
  audio_bitrate: "192"               # kbps
  
  # Rate limiting (API quota management)
  quota_limit_units_per_day: 10000   # YouTube API default
  quota_cost_search: 100             # Units per search
  quota_cost_video_details: 1        # Units per video details

# ============================================================================
# Transcription Configuration (Whisper/faster-whisper)
# ============================================================================
transcription:
  provider: "gemini"                  # gemini, whisper
  gemini_model: "gemini-2.5-flash"

  # Model size: tiny, base, small, medium, large
  model: "medium"
  
  # Language code
  language: "zh"                     # Chinese
  
  # Beam search size (higher = more accurate but slower)
  beam_size: 5
  
  # Beam search patience
  patience: 1.0
  
  # Voice Activity Detection
  enable_vad: true
  vad_min_silence_duration_ms: 500
  vad_speech_pad_ms: 400
  
  # Chunk configuration for long audio
  chunk_length_minutes: 10           # Split long audio into chunks
  chunk_overlap_seconds: 5           # Overlap between chunks
  
  # Device settings
  device: "cuda"                     # cuda or cpu
  compute_type: "float16"            # float32, float16, int8
  
  # Initial prompt (helps with terminology)
  initial_prompt: |
    台灣股市金融術語：買進、加碼、賣出、出脫、持有、觀望、
    嘎空、洗盤、跳空、缺口、壓力、支撐、突破、整理、
    開盤、收盤、盤中、盤後、大盤、加權、台股、上市、上櫃

# ============================================================================
# LLM Extraction Configuration
# ============================================================================
extraction:
  # Provider: openai, anthropic, gemini
  # Set to "local_hf" to use the local open-source Qwen model via transformers
  provider: "qwen"
  
  # Model selection per provider
  models:
    gemini: "gemini-2.5-pro"
    local_hf: "Qwen/Qwen2.5-14B-Instruct-AWQ"
    qwen: "Qwen/Qwen2.5-14B-Instruct-AWQ"

  # Local Hugging Face extraction settings
  local_hf:
    # Official pre-quantized AWQ 4-bit model
    model: "Qwen/Qwen2.5-14B-Instruct-AWQ"
    # Deterministic extraction is recommended for signal parsing
    temperature: 0.0
    # Bounded to protect GPU quota
    max_tokens: 1500
    # Keep remote code enabled for Qwen tokenizer/model compatibility
    trust_remote_code: true
    # Use automatic device placement across available GPUs
    device_map: "auto"
    # Optional: set to "flash_attention_2" only if flash-attn is installed successfully
    attn_implementation: null
  
  # Temperature (0.0-1.0)
  temperature: 0.1                   # Lower = more deterministic
  
  # Maximum tokens for response
  max_tokens: 4096
  
  # Top P (nucleus sampling)
  top_p: 0.95
  
  # Timeout for LLM API call
  api_timeout_seconds: 600
  
  # Cost tracking
  track_tokens: true
  daily_budget_usd: 100.0

  # Optional pricing override (USD / 1M tokens)
  # Used by Pipeline Statistics cost estimation
  pricing:
    gemini:
      flash_input_per_million_usd: 0.30
      flash_output_per_million_usd: 2.50

      pro_input_per_million_usd: 1.25
      pro_output_per_million_usd: 10.00

      pro_long_context_threshold_tokens: 200000
      pro_long_input_per_million_usd: 2.50
      pro_long_output_per_million_usd: 15.00
  
  # Fallback LLM provider (if primary fails)
  fallback_provider: "null"          # Can be "openai", "anthropic", etc.

# ============================================================================
# Stock Data Validation Configuration
# ============================================================================
stock_data:
  # Enable validation against official stock list
  validate_codes: false
  validation_provider: "fugle"      # fugle, local
  fugle_base_url: "https://api.fugle.tw/marketdata/v1.0"
  
  # Stock code format validation
  code_pattern: "^\\d{4,6}[A-Z]?$"   # 4-6 digit Taiwan stock/ETF code, optional suffix letter
  
  # Alias resolution
  resolve_aliases: true
  alias_fuzzy_match: true            # e.g., "台積" -> "2330"
  
  # Data sources
  datasources:
    twse: "./data/stock_codes/twse_stocks.csv"      # Taiwan Stock Exchange
    tpex: "./data/stock_codes/tpex_stocks.csv"      # Taiwan OTC Exchange
  
  # Stock confidence threshold (0.0-1.0)
  min_confidence: 0.3

# ============================================================================
# Output Configuration
# ============================================================================
output:
  # Output format: json, csv, parquet
  format: "json"
  
  # Pretty print JSON
  pretty_print: true
  
  # Include metadata
  include_metadata: true
  
  # Directory structure
  directories:
    transcripts: "./data/transcripts"
    signals: "./data/signals"
    checkpoints: "./data/checkpoints"
    errors: "./data/errors"
    metadata: "./data/metadata"
    debug: "./data/debug"
    logs: "./logs"

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  level: "INFO"                      # DEBUG, INFO, WARNING, ERROR, CRITICAL
  
  # Output targets
  console:
    enabled: true
    format: "standard"               # standard, json, minimal
  
  file:
    enabled: true
    format: "detailed"
    rotation: "daily"                # daily, midnight, 100 MB
    retention: 7                     # days
  
  # Structured logging fields
  include_timestamp: true
  include_module: true
  include_function: true
  include_line_number: true
  
  # Sensitive data masking
  mask_api_keys: true
  mask_video_ids: true

# ============================================================================
# Prompt Templates
# ============================================================================
prompts:
  system: |
    你是一位專業的台股量化分析助手。你的任務是將非結構化的投顧分析逐字稿，轉譯為標準化 JSON 訊號。
    
    【提取與判斷規則】
    0. 實名點名原則（最嚴格限制）：必須是分析師在影片中「明確開口念出」的股票名稱或代碼才可提取。絕不可因分析師提及某產業就自行推敲該產業的代表性股票
    1. 語意轉換：分析師極少直接說「買/賣」，請依據台股慣用語判斷：
      - 判定為 buy：逢低佈局、長線看好、上漲空間大、樂觀看待、突破壓力線。
      - 判定為 sell：悲觀、減碼、形態弱勢、破底/破線、主力倒貨。
      - 判定為 hold：觀望、等表態、震盪、續抱。
    2. 股票代碼補全：若分析師只說出公司簡稱（如：台積電），請務必自行補上正確的台股代碼（大多爲四位數，如：2330）。
    3. 排除雜訊：嚴格忽略「歷史回顧」、「假設性預測（如果...就...）」以及「大盤/總經」的討論。
    4. 最後定論：若同段影片重複提及同一檔股票，以「最後一次」的結論為準。

    【輸出格式要求】
    - 必須且只能回傳一個標準的 JSON Array 格式。不要有任何 Markdown 標記（如 ```json）、不要有任何前言或結語。
    - 如果整段逐字稿中「沒有提到任何具體股票」或「沒有明確買賣訊號」，請嚴格回傳一個空的陣列：[]
    - 陣列內的每個 JSON Object 必須包含以下欄位：
      - "stock_code": (字串) 台股 4 位數代碼
      - "stock_name": (字串) 公司名稱
      - "action": (字串) 只能是 "buy", "sell", 或 "hold"
      - "reasoning": (字串) 分析師明確說過的推薦理由，濃縮在 15 字以內。
  
  extraction: |
    請根據上述系統規則，從以下逐字稿中精確提取「實質買賣訊號」。
    
    --------
    {transcript}
    --------

    請嚴格遵守實名點名原則，提取後直接輸出 JSON。

  system_qwen: |
    你是一位專業的台股量化分析助手。你的任務是將非結構化的投顧分析逐字稿，轉譯為標準化 JSON 訊號。
    
    【提取與判斷規則】
    0. 實名點名原則（最嚴格限制）：必須是分析師在影片中「明確開口念出」的股票名稱或代碼才可提取。絕不可因分析師提及某產業就自行推敲腦補
    1. 語意轉換：分析師極少直接說「買/賣」，請依據台股慣用語判斷：
      - 判定為 buy：逢低佈局、長線看好、上漲空間大、樂觀看待、已突破壓力線。
      - 判定為 sell：悲觀、減碼、形態弱勢、破底破線、主力倒貨、建議換股。
      - 判定為 hold：觀望、等、震盪、續抱。
    2. 股票代碼補全：若分析師只說出公司簡稱（如：台積電），請務必自行補上正確的台股代碼（大多爲四位數，如：2330）。
    3. 排除雜訊：嚴格忽略「歷史回顧」、「假設性預測（如果...就...）」以及「大盤/總經」的討論。
    4. 最後定論：若同段影片重複提及同一檔股票，以「最後一次」的結論為準。

    【輸出格式要求】
    - 必須且只能回傳一個標準的 JSON Array 格式。不要有任何 Markdown 標記（如 ```json）、不要有任何前言或結語。
    - 如果整段逐字稿中「沒有提到任何具體股票」或「沒有明確買賣訊號」，請嚴格回傳一個空的陣列：[]
    - 陣列內的每個 JSON Object 必須包含以下欄位：
      - "stock_code": (字串) 台股 4 位數代碼
      - "stock_name": (字串) 公司名稱
      - "action": (字串) 只能是 "buy", "sell", 或 "hold"
      - "reasoning": (字串) 分析師明確說過的推薦理由，濃縮在 15 字以內。

  extraction_qwen: |
    請根據上述系統規則，從以下逐字稿中精確提取「實質買賣訊號」。
    
    --------
    {transcript}
    --------

    請嚴格遵守實名點名原則，提取後直接輸出 JSON。

# ============================================================================
# Provider-Specific Settings
# ============================================================================
openai:
  api_version: "2024-02-15-preview"
  api_base: "https://api.openai.com/v1"
  organization: ""  # Optional: organization ID

anthropic:
  api_version: "2024-01-15"
  timeout: 60

google:
  api_version: "v1beta"
  timeout: 60
