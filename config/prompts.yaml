  whisper_initial_prompt: |
    這是一段專業的台灣股市分析。我們來看2330台積電漲停、聯發科跌停，
    近期 CoWoS 產能吃緊，CPO 矽光子以及 FOPLP 創新高。
    另外，玻纖布與 GB300 類股線型強勢，飆股基本面要留意 EPS 和本益比，
    技術面，觀察是否突破或破底，ABF載板欣興嘎空或回檔...
    請留意觀察外資投信買賣超動向。
